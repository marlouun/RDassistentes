name = "rdassistentes"
main = "worker/index.ts"
compatibility_date = "2026-08-27"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# O binding D1 `DB` sera conectado pelo painel da Cloudflare.
