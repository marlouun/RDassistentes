name = "rdassistentes"
main = "worker/entry.ts"
compatibility_date = "2026-08-27"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = [ "* * * * *" ]

# O binding D1 `DB` sera conectado pelo painel da Cloudflare.
# Segredos como BOOTSTRAP_SECRET, RD_CONVERSAS_TOKEN,
# RD_CONVERSAS_PRIVATE_JWK e RD_CRM_TOKEN devem ser configurados
# em Variables and Secrets, nunca neste arquivo.
